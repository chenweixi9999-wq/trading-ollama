name: Daily Data Feed Update
on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: pip install requests pandas yfinance akshare fredapi
      
      - name: Run data feed scripts
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          python macro_feed.py
          python hk_local_feed.py
          python polymarket_feed.py
      
      - name: Commit and push updated context files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add *.md
          git commit -m "auto: update data feeds [skip ci]" || exit 0
          git push
